name: Reproduce model and reported evaluations
on:
  push:
    branches: [main]
    paths:
      - 'reproducibility/**'
      - 'models/v2/**'
      - '.github/workflows/research-reproducibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Refit original reliability model and reproduce source-label evaluation
        run: python reproducibility/reproduce_results.py --output reproduced_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-reproducibility
          path: reproduced_results.json
