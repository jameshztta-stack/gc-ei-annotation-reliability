name: V2 deployed Streamlit source-native 609 spent-case inference parity
on:
  push:
    branches:
      - release/streamlit-v2-frozen-m1-hgb-20261014
    paths:
      - scripts/check_v2_streamlit_609_parity_no_retuning.py
      - .github/workflows/v2-streamlit-inference-parity.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  source-locked-v2-app-no-retuning:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GCEI_V2_609_SOFTWARE_PARITY_ONLY: 'YES_SPENT_609_NO_MODEL_SELECTION'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 'Install EXACT application dependencies'
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: 'Retrieve FIRST-USE 609 scoring results unchanged; permanently SPENT dataset'
        run: |
          set -euo pipefail
          mkdir -p .cache
          git fetch --no-tags --depth=1 origin research/v2-methodology-redesign-20261013:refs/remotes/origin/research/v2-methodology-redesign-20261013
          git show origin/research/v2-methodology-redesign-20261013:audits/v2_609_one_shot_within_msdial_20261014/v2_609_single_use_within_msdial_per_query.csv > .cache/v2_locked_609_predictions.csv
          echo '62899a9be61118299e730558fe097e61e7423411d6ea33ea678245f282b41dd7  .cache/v2_locked_609_predictions.csv' | sha256sum --check
      - name: 'Obtain ORIGINAL publisher EI source only (same exact SHA as previous 609 test)'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from gcei.bootstrap import _download_source
          p=Path('.cache/v2_original_sha_locked_msdial.msp')
          _download_source(p)
          PY
          echo 'a1035f8d6c4e717e5fe086f11baadb5f5d44bec3d98d68c7415a1295ae304a70  .cache/v2_original_sha_locked_msdial.msp' | sha256sum --check
      - name: 'Rebuild 8455 reference and replay ALL previously used 609 candidates in frozen Streamlit v2 engine'
        run: |
          set -euo pipefail
          python scripts/check_v2_streamlit_609_parity_no_retuning.py
      - name: 'Archive engineering parity record, not new scientific validation'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/v2_streamlit_frozen_parity_20261014
          if ! git diff --cached --quiet; then
            git commit -m 'Archive exact frozen Streamlit v2 609-replay parity with original reference, HGB and 5/10 masks, no scientific retuning'
            git pull --rebase origin release/streamlit-v2-frozen-m1-hgb-20261014
            git push origin HEAD:release/streamlit-v2-frozen-m1-hgb-20261014
          fi
      - name: 'Demand full-case parity results without certified-risk claims'
        run: |
          set -euo pipefail
          test -s audits/v2_streamlit_frozen_parity_20261014/v2_standalone_app_exact_609_software_parity.json
          grep -q 'PASS_ALL_609_SPENT_TEST_CASES_EXACT_APP_INFERENCE_PARITY_NO_RETUNING' audits/v2_streamlit_frozen_parity_20261014/v2_standalone_app_exact_609_software_parity.json
