name: Publish GC EI MS Annotation Tool v2.0.2 to GitHub and Zenodo
on:
  push:
    branches:
      - main
    paths:
      - docs/RELEASE_V2_0_2.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated_software_release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact runtime and scientific test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Verify latest single-model interface and archived original scientific assets
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q
          python -m py_compile app.py
          echo '2d7e66be8ad2c93aa08eefc0cd54a25c1c1788502856a35fcedb49cb84759a01  models/v2/reference_index.csv' | sha256sum --check
          echo 'a9370828084881072307fe081f3ecc34e400d26c6710c8a542bbad0bad0ccf13  models/v2/hgb_model.joblib' | sha256sum --check
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))
          c=Path('CITATION.cff').read_text(encoding='utf-8')
          app=Path('app.py').read_text(encoding='utf-8')
          assert j['version']=='2.0.2'
          assert 'version: 2.0.2' in c
          assert 'APP_VERSION = "2.0.2"' in app
          assert 'GCEIEngine' not in app
          assert 'V1_MODE' not in app
          assert 'frozen' not in app.lower()
          assert 'identifiers:' not in c
          print('PASS public single-model app and pre-DOI citation metadata')
          PY
      - name: Verify preserved original legacy software reproducibility as historical regression
        run: |
          set -euo pipefail
          python scripts/check_reproducibility.py
      - name: Publish GitHub v2.0.2 version to existing Zenodo GitHub bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version 2.0.2 was already published. Never replace archived source."
            gh release view v2.0.2 --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish
          else
            gh release create v2.0.2 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GC–EI–MS Annotation Tool v2.0.2" \
              --notes-file docs/RELEASE_V2_0_2.md \
              --latest
          fi
          echo "Publication on Zenodo must be verified independently; prior version DOIs remain intact."
