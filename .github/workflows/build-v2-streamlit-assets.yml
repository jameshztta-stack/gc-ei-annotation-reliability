name: Build frozen v2 Streamlit reference and HGB release assets
on:
  push:
    branches:
      - release/streamlit-v2-frozen-m1-hgb-20261014
    paths:
      - scripts/build_v2_app_frozen_release_assets.py
      - .github/workflows/build-v2-streamlit-assets.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  exact-frozen-v2-reference-and-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PREVIOUSLY frozen HGB numerical versions
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib
      - name: Retrieve ORIGINAL 8455 MS-DIAL identity ledger from preexisting Phase 1.6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p models/v2 .cache
          gh run download 38350933160 -n phase1-6-chemical-identity-candidate-ledger --repo "$GITHUB_REPOSITORY" --dir .cache/phase1_6_original
          cp .cache/phase1_6_original/phase1_6_connectivity_reference_index.csv models/v2/reference_index.csv
          sha256sum models/v2/reference_index.csv
          echo '2d7e66be8ad2c93aa08eefc0cd54a25c1c1788502856a35fcedb49cb84759a01  models/v2/reference_index.csv' | sha256sum --check
      - name: Retrieve EXACT PRE-609 1410 development features from original frozen research branch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin research/v2-methodology-redesign-20261013:refs/remotes/origin/research/v2-methodology-redesign-20261013
          git show origin/research/v2-methodology-redesign-20261013:audits/v2_m1_development/v2_m1_development_only_nested_cv_predictions.csv > .cache/v2_original_1410_development_predictions.csv
          echo '67a209e835279852a91e92abad7a3598fd38f6fd6978082b75c46d6eb4a745ce  .cache/v2_original_1410_development_predictions.csv' | sha256sum --check
      - name: Recreate byte-for-byte same original trusted HGB model and version-lock manifest
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python scripts/build_v2_app_frozen_release_assets.py
          echo 'a9370828084881072307fe081f3ecc34e400d26c6710c8a542bbad0bad0ccf13  models/v2/hgb_model.joblib' | sha256sum --check
      - name: Commit artifact WITHOUT original 609 or source spectra to release branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/v2/reference_index.csv models/v2/hgb_model.joblib models/v2/release_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pin original 8455 research first14 reference and exact SHA-matched 1410-dev-fitted HGB for v2 app'
            git pull --rebase origin release/streamlit-v2-frozen-m1-hgb-20261014
            git push origin HEAD:release/streamlit-v2-frozen-m1-hgb-20261014
          fi
