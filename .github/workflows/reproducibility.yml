name: Reproduce example analyses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify original source, model and supplied example spectra
        run: python scripts/verify_software.py --examples
