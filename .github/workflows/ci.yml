name: Software tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify source code, numerical model and interface
        run: |
          python scripts/verify_software.py
          PYTHONPATH=. python -m pytest -q tests/
